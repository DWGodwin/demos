<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tools</title>
<style>
:root{--bg:#f3f4f2;--fg:#1d2420;--muted:#5f6a64;--link:#0e7c7b}
@media (prefers-color-scheme:dark){:root{--bg:#14191b;--fg:#e6ebe8;--muted:#97a39d;--link:#3dc2bf}}
body{margin:0;padding:32px 16px;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif}
main{max-width:640px;margin:0 auto}h1{font-size:24px;margin:0 0 16px}
ul{list-style:none;padding:0;margin:0}li{padding:8px 0;border-bottom:1px solid color-mix(in srgb,var(--muted) 25%,transparent)}
a{color:var(--link);font-weight:600;text-decoration:none}a:hover{text-decoration:underline}span{color:var(--muted);margin-left:8px}
</style></head><body><main>
<h1>Tools</h1>
<ul>
  <li><a href="geotransform">Geotransform Playground</a><span>GDAL geotransform, affine and projective matrices, in degrees, Web Mercator or UTM metres</span></li>
</ul>
</main></body></html>
